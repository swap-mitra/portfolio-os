<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- The drive scene reduced to what survives at 16px: sun, horizon, road.
       Colours are the tokens from src/styles/tokens.css, hardcoded because a
       favicon is loaded outside the document and inherits none of them. -->
  <rect width="16" height="16" fill="#0b0b16"/>

  <!-- Sun, banded top to bottom the way the canvas draws it. -->
  <rect x="6" y="3" width="4" height="1" fill="#ffe14d"/>
  <rect x="5" y="4" width="6" height="1" fill="#ffe14d"/>
  <rect x="4" y="5" width="8" height="1" fill="#ff8a3d"/>
  <rect x="4" y="6" width="8" height="1" fill="#ff8a3d"/>
  <rect x="4" y="7" width="8" height="1" fill="#ff2e6b"/>
  <rect x="5" y="8" width="6" height="1" fill="#ff2e6b"/>
  <rect x="6" y="9" width="4" height="1" fill="#ff2e6b"/>

  <!-- Horizon. -->
  <rect x="0" y="10" width="16" height="1" fill="#23f0ff"/>

  <!-- Ground and the road running to the vanishing point. -->
  <rect x="0" y="11" width="16" height="5" fill="#180a2e"/>
  <path d="M7 11 h2 l3 5 h-8 Z" fill="#0b0b16"/>
  <rect x="7" y="12" width="1" height="1" fill="#ffe14d"/>
  <rect x="7" y="14" width="2" height="2" fill="#ffe14d"/>
</svg>
