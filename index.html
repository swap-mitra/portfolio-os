<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The name leads the title on purpose: the search this site needs to win
         is "Swapnil Mitra", and the title is the heaviest signal Google has
         for that. PORTFOLIO-OS is the theme, not the query anyone types. -->
    <title>Swapnil Mitra | Software Engineer</title>
    <meta
      name="description"
      content="Swapnil Mitra is a software engineer in Mumbai working with .NET, Azure, React and TypeScript. Portfolio, projects and resume, dressed up as a retro desktop OS."
    />
    <meta name="author" content="Swapnil Mitra" />
    <meta name="theme-color" content="#0b0b16" />

    <!-- The Vercel deployment URLs serve this same page. Without a canonical
         they compete with the custom domain as duplicates and split whatever
         ranking the name query earns. -->
    <link rel="canonical" href="https://www.s-mitter.space/" />

    <!-- Link previews. Both URLs below are absolute on purpose: scrapers do
         not resolve a relative og:image against the page, they just drop it,
         so a relative path fails silently and the card ships blank. That
         means the domain is hardcoded here. Change both together, and the
         canonical above and the JSON-LD below, if this ever moves again. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Swapnil Mitra" />
    <meta property="og:title" content="Swapnil Mitra | Software Engineer" />
    <meta
      property="og:description"
      content="Software engineer in Mumbai. Portfolio, projects and resume, dressed up as a retro desktop operating system."
    />
    <meta property="og:url" content="https://www.s-mitter.space/" />
    <meta property="og:image" content="https://www.s-mitter.space/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A retro desktop over a synthwave sunset and an empty road." />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Tells Google this page is *about a person*, and `sameAs` is what ties
         that person to the GitHub and LinkedIn profiles already ranking for
         the same name. Without it the three are unrelated pages that happen
         to share a string. Keep it in sync with src/data/siteConfig.ts. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Swapnil Mitra",
        "url": "https://www.s-mitter.space/",
        "image": "https://www.s-mitter.space/og-image.png",
        "jobTitle": "Software Engineer",
        "description": "Software engineer working across full-stack development, integration and cloud architecture with .NET, Azure, React and TypeScript.",
        "email": "mailto:swpnlmitra@gmail.com",
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "Indian Institute of Technology Kharagpur" },
        "address": { "@type": "PostalAddress", "addressLocality": "Mumbai", "addressCountry": "IN" },
        "knowsAbout": ["Software Engineering", "Solution Architecture", "Azure", ".NET", "React", "TypeScript", "Distributed Systems"],
        "sameAs": [
          "https://github.com/swap-mitra",
          "https://www.linkedin.com/in/swapnilmitra/"
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
